# PKI detections. Each search maps to a runbook in docs/runbooks.
# Schedules are staggered; all alerts go to the SOC queue + PKI on-call.

[PKI - Out-of-band AWS Private CA trust change]
description = Destructive or trust-changing AWS Private CA API call not made by the HCP Terraform apply role. Runbook: security-tripwire.md
search = `pki_cloudtrail` eventSource="acm-pca.amazonaws.com" eventName IN ("DeleteCertificateAuthority","UpdateCertificateAuthority","RestoreCertificateAuthority","ImportCertificateAuthorityCertificate","CreatePermission","DeletePermission","PutPolicy","DeletePolicy") NOT userIdentity.arn=`pki_pipeline_identity` \
| table _time eventName userIdentity.arn sourceIPAddress userAgent requestParameters.certificateAuthorityArn errorCode
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.suppress = 0
action.email = 1
action.email.to = soc@example.com, pki-oncall@example.com

[PKI - Certificate revoked]
description = Every revocation is reviewed: reason, operator, ticket. Runbook: certificate-revocation.md
search = `pki_cloudtrail` eventSource="acm-pca.amazonaws.com" eventName="RevokeCertificate" \
| table _time userIdentity.arn requestParameters.certificateAuthorityArn requestParameters.certificateSerial requestParameters.revocationReason
cron_schedule = 2-59/15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
action.email = 1
action.email.to = pki-oncall@example.com

[PKI - Private key exported from ACM outside the distributor]
description = acm:ExportCertificate by an identity other than the renewal distributor Lambda.
search = `pki_cloudtrail` eventSource="acm.amazonaws.com" eventName="ExportCertificate" NOT userIdentity.arn="*acm-renewal-distributor*" \
| table _time userIdentity.arn sourceIPAddress requestParameters.certificateArn
cron_schedule = 4-59/5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
action.email = 1
action.email.to = soc@example.com, pki-oncall@example.com

[PKI - Issuance spike per CA]
description = Certificate issuance volume more than 3 standard deviations above the 14-day baseline (compromised automation or abuse of a shared CA).
search = `pki_cloudtrail` eventSource="acm-pca.amazonaws.com" eventName="IssueCertificate" earliest=-14d@h latest=@h \
| bin _time span=1h \
| stats count by _time requestParameters.certificateAuthorityArn \
| rename requestParameters.certificateAuthorityArn as ca \
| eventstats avg(count) as avg stdev(count) as sd by ca \
| where _time >= relative_time(now(), "-1h@h") AND count > avg + 3*sd AND count > 20
cron_schedule = 7 * * * *
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
action.email = 1
action.email.to = pki-oncall@example.com

[PKI - CRL stale or unreachable]
description = Results of the CRL freshness checker Lambda. Runbook: crl-expired.md
search = `pki_events` "pki.crl.check" status!="OK" \
| spath \
| stats latest(status) as status latest(hours_until_next_update) as hours_left latest(error) as error by crl_url
cron_schedule = 9-59/15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
action.email = 1
action.email.to = pki-oncall@example.com

[PKI - ADCS ESC1 suspicious enrollment]
description = ADCS issued a certificate where the requested SAN differs from the requester (ESC1 pattern). Runbook: security-tripwire.md
search = `pki_adcs` EventCode=4887 \
| rex field=Attributes "(?i)san:upn=(?<requested_upn>[^&\s]+)" \
| eval requester_user=lower(mvindex(split(Requester, "\\"), 1)) \
| where isnotnull(requested_upn) AND lower(mvindex(split(requested_upn, "@"), 0)) != requester_user \
| table _time host Requester requested_upn CertificateTemplate RequestId
cron_schedule = */10 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
action.email = 1
action.email.to = soc@example.com, pki-oncall@example.com

[PKI - ADCS template or CA configuration changed]
description = ADCS security settings or templates modified (EventCode 4899 template updated, 4900 template security updated, 4890 CA manager settings).
search = `pki_adcs` EventCode IN (4890,4899,4900) | table _time host EventCode SubjectUserName TemplateName
cron_schedule = 3-59/10 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
action.email = 1
action.email.to = pki-oncall@example.com

[PKI - HSM authentication failures]
description = Repeated authentication failures on an HSM (syslog / SNMP authenticationFailure traps).
search = `pki_hsm` ("authentication failure" OR "login failed" OR "authenticationFailure") \
| stats count by host \
| where count >= 3
cron_schedule = 5-59/10 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
action.email = 1
action.email.to = soc@example.com, pki-oncall@example.com

[PKI - Monthly issuance report (PCI evidence)]
description = Certificates issued and revoked per CA in the previous month.
search = `pki_cloudtrail` eventSource="acm-pca.amazonaws.com" eventName IN ("IssueCertificate","RevokeCertificate") earliest=-1mon@mon latest=@mon \
| stats count by requestParameters.certificateAuthorityArn eventName
cron_schedule = 0 6 1 * *
enableSched = 1
action.email = 1
action.email.to = pki-team@example.com
action.email.sendcsv = 1
