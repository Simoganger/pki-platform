# Adjust index / sourcetype names to your Splunk deployment.

[pki_cloudtrail]
definition = (index=aws sourcetype=aws:cloudtrail)

[pki_events]
definition = (index=aws sourcetype=aws:firehose:json OR sourcetype=aws:cloudwatchlogs) "pki"

[pki_adcs]
definition = (index=wineventlog source="XmlWinEventLog:Security" EventCode IN (4886,4887,4888,4890,4896,4898,4899,4900))

[pki_hsm]
definition = (index=network sourcetype=syslog tag=hsm)

[pki_pipeline_identity]
definition = "*:assumed-role/hcp-terraform-pki-apply*"
