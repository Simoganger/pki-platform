# Pull request pipeline: everything a reviewer needs BEFORE approving.
#
#   static     terraform fmt / validate / test, tflint
#   security   Checkov (IaC misconfigurations), TruffleHog (secrets), actionlint
#   python     unit tests of Lambdas and scripts
#   plan       speculative plan on HCP Terraform for every affected workspace,
#              posted as a PR comment (Sentinel policies are evaluated too)
#
# Security posture of this workflow
#   - Trigger is `pull_request` (NOT pull_request_target): code from a branch
#     never runs with write permissions or deployment secrets.
#   - GITHUB_TOKEN is read-only by default; the plan job only adds the right to
#     comment on the PR.
#   - Every third-party action is pinned to a full commit SHA (the tag is in
#     the trailing comment, Dependabot keeps both up to date). Enforce it with
#     the org policy "Require actions to be pinned to a full-length commit SHA".
#   - The HCP token used here belongs to team pki-ci-plan, which can ONLY run
#     speculative plans (it cannot apply anything).
#   - No AWS credentials exist in GitHub: HCP Terraform obtains them by OIDC.

name: terraform-ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.13.3"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  changes:
    name: Affected workspaces
    runs-on: ubuntu-latest
    outputs:
      workspaces: ${{ steps.affected.outputs.workspaces }}
      any: ${{ steps.affected.outputs.any }}
    steps:
      - uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          ws="$(python3 scripts/ci/affected_workspaces.py --changed-files "$changed")"
          echo "workspaces=$ws" >> "$GITHUB_OUTPUT"
          if [ "$ws" = "[]" ]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi
          echo "Affected workspaces: $ws"

  static:
    name: fmt / validate / test / tflint
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Build Lambda packages (needed by archive_file during validate)
        run: ./lambda/build.sh

      - name: terraform validate (every module and root)
        run: |
          set -euo pipefail
          for dir in $(find modules environments bootstrap examples -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "::group::validate $dir"
            # -backend=false: no HCP Terraform access is needed to validate
            terraform -chdir="$dir" init -backend=false -input=false -no-color >/dev/null
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

      - name: terraform test (module + workspace tests, mocked providers)
        run: |
          set -euo pipefail
          for testdir in $(find modules environments -name '*.tftest.hcl' -exec dirname {} \; | sort -u); do
            dir="$(dirname "$testdir")"
            echo "::group::test $dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color >/dev/null
            terraform -chdir="$dir" test -no-color
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.58.1

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids API rate limits when downloading plugins
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  security:
    name: Checkov / secrets / actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkov (IaC security scan)
        uses: bridgecrewio/checkov-action@38a95e98d734de90b74687a0fc94cfb4dcc9c169 # v12.3040.0
        with:
          directory: .
          config_file: .checkov.yaml

      - name: TruffleHog (verified secrets in the PR diff)
        uses: trufflesecurity/trufflehog@ddc015e5ed99942b2253d8ea16a0586a01ef2ab1 # v3.88.0
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown

      - name: Block private keys anywhere in the repository
        run: |
          if git grep -nIE -- '-----BEGIN ((RSA|EC|ENCRYPTED|OPENSSH) )?PRIVATE KEY-----' -- . ':!tests/**' ':!*.md'; then
            echo "::error::Private key material found in the repository"; exit 1
          fi

      - name: actionlint (workflow linting, includes shellcheck)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/03d0035246f3e81f36aed592ffb4bebf33a03106/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  python:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"

      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/python

  plan:
    name: Speculative plan - ${{ matrix.workspace }}
    needs: [changes, static, security, python]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comment the plan summary
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.workspaces) }}
    steps:
      - uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build Lambda packages
        run: ./lambda/build.sh

      - name: Upload configuration (speculative)
        id: upload
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        with:
          hostname: ${{ vars.TF_CLOUD_HOSTNAME }}
          organization: ${{ vars.TF_CLOUD_ORGANIZATION }}
          token: ${{ secrets.TF_API_TOKEN_PLAN }}
          workspace: ${{ matrix.workspace }}
          directory: ./ # whole repo: roots reference ../../../modules (working_directory set on the workspace)
          speculative: true

      - name: Create plan-only run
        id: run
        uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        with:
          hostname: ${{ vars.TF_CLOUD_HOSTNAME }}
          organization: ${{ vars.TF_CLOUD_ORGANIZATION }}
          token: ${{ secrets.TF_API_TOKEN_PLAN }}
          workspace: ${{ matrix.workspace }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          plan_only: true
          message: "PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.head.sha }}"

      - name: Plan output
        id: plan
        if: always() && steps.run.outputs.plan_id != ''
        uses: hashicorp/tfc-workflows-github/actions/plan-output@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        with:
          hostname: ${{ vars.TF_CLOUD_HOSTNAME }}
          organization: ${{ vars.TF_CLOUD_ORGANIZATION }}
          token: ${{ secrets.TF_API_TOKEN_PLAN }}
          plan: ${{ steps.run.outputs.plan_id }}

      - name: Comment on the PR
        if: always() && steps.run.outputs.run_link != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          WORKSPACE: ${{ matrix.workspace }}
          RUN_LINK: ${{ steps.run.outputs.run_link }}
          RUN_STATUS: ${{ steps.run.outputs.run_status }}
          ADD: ${{ steps.plan.outputs.add }}
          CHANGE: ${{ steps.plan.outputs.change }}
          DESTROY: ${{ steps.plan.outputs.destroy }}
        with:
          script: |
            // Values come from env (never interpolated into the script) to avoid injection.
            const { WORKSPACE, RUN_LINK, RUN_STATUS, ADD, CHANGE, DESTROY } = process.env;
            const marker = `<!-- tfc-plan:${WORKSPACE} -->`;
            const destroyWarning = Number(DESTROY || 0) > 0
              ? '\n> **Warning:** this plan DESTROYS resources. CA deletions are blocked by Sentinel; check carefully anything else.\n'
              : '';
            const body = `${marker}
            ### HCP Terraform plan - \`${WORKSPACE}\`
            | Status | Add | Change | Destroy |
            |---|---|---|---|
            | ${RUN_STATUS} | ${ADD || '-'} | ${CHANGE || '-'} | ${DESTROY || '-'} |
            ${destroyWarning}
            [Open the run in HCP Terraform](${RUN_LINK}) (full plan and Sentinel policy results).`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if the plan or policies failed
        if: steps.run.outputs.run_status == 'errored' || steps.run.outputs.run_status == 'policy_soft_failed'
        env:
          RUN_STATUS: ${{ steps.run.outputs.run_status }}
        run: |
          echo "::error::Run ended with status $RUN_STATUS"
          exit 1
