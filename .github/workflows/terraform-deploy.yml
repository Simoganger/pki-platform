# Deployment pipeline (main branch only).
#
#   merge to main
#     -> nonprod: plan + apply on every affected nonprod workspace
#        (GitHub environment "nonprod": deployment branch = main)
#     -> prod-plan: confirmable run created on HCP Terraform, plan summary
#        written to the job summary for the approvers
#        (environment "production-plan": branch = main, no reviewer)
#     -> prod-apply: WAITS for 2 approvers of the PKI team (environment
#        "production": required reviewers, prevent self-review, branch = main),
#        then confirms exactly the run that was reviewed
#     -> if the approval is rejected or times out, the HCP run is discarded
#
# Controls mapped to PCI DSS 4.0.1 6.5.x (change management) and the
# separation of duties: the author of a change cannot approve its production
# apply (GitHub "prevent self-review"), and HCP Terraform enforces Sentinel
# hard-mandatory policies on every run whatever the approvals say.

name: terraform-deploy

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/**"
      - "lambda/**"
  workflow_dispatch:
    inputs:
      all_workspaces:
        description: "Plan/apply every workspace (not only the changed ones)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  changes:
    name: Affected workspaces
    runs-on: ubuntu-latest
    outputs:
      nonprod: ${{ steps.affected.outputs.nonprod }}
      prod: ${{ steps.affected.outputs.prod }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: affected
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all_workspaces }}
        run: |
          set -euo pipefail
          if [ "$ALL" = "true" ] || [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            flag="--all"; changed=""
          else
            flag=""; changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          fi
          echo "nonprod=$(python3 scripts/ci/affected_workspaces.py --env nonprod $flag --changed-files "$changed")" >> "$GITHUB_OUTPUT"
          echo "prod=$(python3 scripts/ci/affected_workspaces.py --env prod $flag --changed-files "$changed")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  nonprod:
    name: Apply nonprod - ${{ matrix.workspace }}
    needs: changes
    if: needs.changes.outputs.nonprod != '[]'
    runs-on: ubuntu-latest
    environment: nonprod
    concurrency:
      group: tfc-${{ matrix.workspace }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1 # pki-core before observability (observability reads its outputs)
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.nonprod) }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Lambda packages
        run: ./lambda/build.sh

      - name: Upload configuration
        id: upload
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        with:
          hostname: ${{ vars.TF_CLOUD_HOSTNAME }}
          organization: ${{ vars.TF_CLOUD_ORGANIZATION }}
          token: ${{ secrets.TF_API_TOKEN }}
          workspace: ${{ matrix.workspace }}
          directory: ./

      - name: Create run (plan + Sentinel)
        id: run
        uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        with:
          hostname: ${{ vars.TF_CLOUD_HOSTNAME }}
          organization: ${{ vars.TF_CLOUD_ORGANIZATION }}
          token: ${{ secrets.TF_API_TOKEN }}
          workspace: ${{ matrix.workspace }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          message: "${{ github.sha }} by ${{ github.actor }} (${{ github.run_id }})"

      - name: Apply
        if: fromJSON(steps.run.outputs.payload).data.attributes.actions.IsConfirmable
        uses: hashicorp/tfc-workflows-github/actions/apply-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        with:
          hostname: ${{ vars.TF_CLOUD_HOSTNAME }}
          organization: ${{ vars.TF_CLOUD_ORGANIZATION }}
          token: ${{ secrets.TF_API_TOKEN }}
          run: ${{ steps.run.outputs.run_id }}
          comment: "Applied by GitHub Actions run ${{ github.run_id }} (commit ${{ github.sha }})"

  prod-plan:
    name: Plan prod - ${{ matrix.workspace }}
    needs: [changes, nonprod]
    # Run when there is prod work and nonprod either succeeded or had nothing to do.
    if: >-
      always() &&
      needs.changes.outputs.prod != '[]' &&
      (needs.nonprod.result == 'success' || needs.nonprod.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production-plan
    concurrency:
      group: tfc-${{ matrix.workspace }}
      cancel-in-progress: false
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.prod) }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Lambda packages
        run: ./lambda/build.sh

      - name: Upload configuration
        id: upload
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        with:
          hostname: ${{ vars.TF_CLOUD_HOSTNAME }}
          organization: ${{ vars.TF_CLOUD_ORGANIZATION }}
          token: ${{ secrets.TF_API_TOKEN }}
          workspace: ${{ matrix.workspace }}
          directory: ./

      - name: Create confirmable run
        id: run
        uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        with:
          hostname: ${{ vars.TF_CLOUD_HOSTNAME }}
          organization: ${{ vars.TF_CLOUD_ORGANIZATION }}
          token: ${{ secrets.TF_API_TOKEN }}
          workspace: ${{ matrix.workspace }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          message: "PROD ${{ github.sha }} by ${{ github.actor }} (${{ github.run_id }}) - awaiting approval"

      - name: Plan output
        id: plan
        uses: hashicorp/tfc-workflows-github/actions/plan-output@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        with:
          hostname: ${{ vars.TF_CLOUD_HOSTNAME }}
          organization: ${{ vars.TF_CLOUD_ORGANIZATION }}
          token: ${{ secrets.TF_API_TOKEN }}
          plan: ${{ steps.run.outputs.plan_id }}

      - name: Summary for approvers
        env:
          WORKSPACE: ${{ matrix.workspace }}
          RUN_LINK: ${{ steps.run.outputs.run_link }}
          ADD: ${{ steps.plan.outputs.add }}
          CHANGE: ${{ steps.plan.outputs.change }}
          DESTROY: ${{ steps.plan.outputs.destroy }}
        run: |
          {
            echo "## Production plan - \`$WORKSPACE\`"
            echo ""
            echo "| Add | Change | Destroy |"
            echo "|---|---|---|"
            echo "| $ADD | $CHANGE | $DESTROY |"
            echo ""
            echo "Review the full plan and Sentinel results before approving: $RUN_LINK"
            if [ "${DESTROY:-0}" != "0" ]; then echo ""; echo "> **This plan destroys resources.**"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Matrix jobs cannot merge outputs, so each workspace records its run id
      # in a tiny artifact that the approval job collects.
      - name: Record run id
        env:
          WORKSPACE: ${{ matrix.workspace }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          CONFIRMABLE: ${{ fromJSON(steps.run.outputs.payload).data.attributes.actions.IsConfirmable }}
        run: |
          mkdir -p prod-runs
          if [ "$CONFIRMABLE" = "true" ]; then
            printf '{"workspace":"%s","run_id":"%s"}' "$WORKSPACE" "$RUN_ID" > "prod-runs/$WORKSPACE.json"
          else
            echo "No changes to apply in $WORKSPACE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: hashFiles('prod-runs/*.json') != ''
        with:
          name: prod-run-${{ matrix.workspace }}
          path: prod-runs/
          retention-days: 1

  prod-apply:
    name: Apply prod (approval required)
    needs: [changes, prod-plan]
    if: needs.prod-plan.result == 'success'
    runs-on: ubuntu-latest
    environment: production # required reviewers: 2 PKI engineers, prevent self-review
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prod-run-*
          path: prod-runs
          merge-multiple: true

      - name: Apply the reviewed runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TFC_HOST: ${{ vars.TF_CLOUD_HOSTNAME }}
          TFC_TOKEN: ${{ secrets.TF_API_TOKEN }}
          COMMENT: "Approved in GitHub environment 'production' - workflow run ${{ github.run_id }}"
        with:
          script: |
            // Confirms EXACTLY the run ids that approvers reviewed (no new plan).
            const fs = require('fs');
            const files = fs.existsSync('prod-runs') ? fs.readdirSync('prod-runs').filter(f => f.endsWith('.json')) : [];
            const runs = Object.fromEntries(files.map(f => {
              const r = JSON.parse(fs.readFileSync(`prod-runs/${f}`, 'utf8'));
              return [r.workspace, r.run_id];
            }));
            if (files.length === 0) { core.info('Nothing to apply'); return; }
            const host = process.env.TFC_HOST || 'app.terraform.io';
            for (const [workspace, runId] of Object.entries(runs)) {
              core.info(`Applying ${runId} on ${workspace}`);
              const res = await fetch(`https://${host}/api/v2/runs/${runId}/actions/apply`, {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.TFC_TOKEN}`,
                  'Content-Type': 'application/vnd.api+json',
                },
                body: JSON.stringify({ comment: process.env.COMMENT }),
              });
              if (res.status !== 202) {
                core.setFailed(`Apply of ${runId} (${workspace}) failed: HTTP ${res.status} ${await res.text()}`);
                return;
              }
              core.summary.addRaw(`Applied run ${runId} on ${workspace}\n`);
            }
            await core.summary.write();

  prod-discard:
    name: Discard unapproved prod runs
    needs: [prod-plan, prod-apply]
    if: always() && needs.prod-plan.result == 'success' && needs.prod-apply.result != 'success'
    runs-on: ubuntu-latest
    environment: production-plan
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prod-run-*
          path: prod-runs
          merge-multiple: true

      - name: Discard
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TFC_HOST: ${{ vars.TF_CLOUD_HOSTNAME }}
          TFC_TOKEN: ${{ secrets.TF_API_TOKEN }}
        with:
          script: |
            // A pending confirmable run would block the workspace queue.
            const fs = require('fs');
            const files = fs.existsSync('prod-runs') ? fs.readdirSync('prod-runs').filter(f => f.endsWith('.json')) : [];
            const runs = Object.fromEntries(files.map(f => {
              const r = JSON.parse(fs.readFileSync(`prod-runs/${f}`, 'utf8'));
              return [r.workspace, r.run_id];
            }));
            const host = process.env.TFC_HOST || 'app.terraform.io';
            for (const [workspace, runId] of Object.entries(runs)) {
              const res = await fetch(`https://${host}/api/v2/runs/${runId}/actions/discard`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${process.env.TFC_TOKEN}`, 'Content-Type': 'application/vnd.api+json' },
                body: JSON.stringify({ comment: 'Production approval rejected or timed out' }),
              });
              core.info(`Discard ${runId} (${workspace}): HTTP ${res.status}`);
            }
